<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="videos_titulo">Vídeos | Sangre Carbayona</title>

    <!-- CONFIGURACIÓN DE VERSIONES (Cargar PRIMERO) -->
    <script src="js/config.js?nocache=20260831v2"></script>

    <!-- CSS Principales -->
    <link rel="stylesheet" href="css/styles.css?nocache=20260831v2" />
    <link rel="stylesheet" href="css/equipo-styles.css?nocache=20260831v2" />
    <link rel="stylesheet" href="css/videos.css?nocache=20260831v2" />

    <!-- Fonts e Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta
      name="description"
      content="Resúmenes de partidos y mejores momentos del Real Oviedo."
    />

    <!-- Meta Tags para Compartir (OPEN GRAPH) -->
    <meta property="og:title" content="Vídeos | Sangre Carbayona" />
    <meta
      property="og:description"
      content="Resúmenes de partidos y mejores momentos del Real Oviedo."
    />
    <!-- Imagen que se mostrará al compartir. Usamos una imagen real de tu web -->
    <meta
      property="og:image"
      content="https://i.postimg.cc/tgL8SLYy/Sangre-Carbayona-C-D-Oviedo-Stadium-Ovetense.webp"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Header Principal -->
    <header class="main-header" id="header-placeholder"></header>
    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
            aria-label="Buscar en la web"
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <!-- Page Header -->
    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-videos/1920/400"
          alt="Estadio"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <span class="current" data-i18n="nav_videos">Vídeos</span>
        </div>
        <h1 class="page-title" data-i18n="nav_videos">Vídeos</h1>
        <p class="page-subtitle" data-i18n="videos_subtitulo">
          Resúmenes y mejores momentos de la temporada
        </p>
      </div>
    </section>

    <!-- CONTENIDO DE VIDEOS -->
    <section class="full-squad-section" style="padding: 60px 0">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title" data-i18n="videos_resumenes">
            Resúmenes de Partidos
          </h2>
        </div>

        <!-- NUEVO: Compartir Página Completa -->
        <div class="video-page-share">
          <p data-i18n="compartir_pagina">Comparte esta página</p>
          <div class="video-share-buttons">
            <a
              href="#"
              class="video-share-btn whatsapp"
              id="share-whatsapp"
              title="Compartir en WhatsApp"
            >
              <i class="fab fa-whatsapp"></i>
            </a>
            <a
              href="#"
              class="video-share-btn twitter"
              id="share-twitter"
              title="Compartir en Twitter"
            >
              <i class="fab fa-twitter"></i>
            </a>
            <a
              href="#"
              class="video-share-btn telegram"
              id="share-telegram"
              title="Compartir en Telegram"
            >
              <i class="fab fa-telegram-plane"></i>
            </a>
            <a
              href="#"
              class="video-share-btn facebook"
              id="share-facebook"
              title="Compartir en Facebook"
            >
              <i class="fab fa-facebook-f"></i>
            </a>
          </div>
        </div>

        <div id="videosGrid" class="videos-grid"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <!-- Cookie Banner -->
    <div class="cookie-banner" id="cookieBanner">
      <div class="cookie-content">
        <p>
          Utilizamos cookies para mejorar tu experiencia.
          <a href="#">Más información</a>
        </p>
        <div class="cookie-buttons">
          <button type="button" class="btn-cookie reject" id="rejectCookies">
            Rechazar
          </button>
          <button type="button" class="btn-cookie accept" id="acceptCookies">
            Aceptar
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/i18n.js?nocache=20260831v2"></script>
    <script src="js/seo.js?nocache=20260831v2"></script>
    <script src="js/data-club.js?nocache=20260831v2"></script>
    <script src="js/data-jugadores.js?nocache=20260831v2"></script>
    <script src="js/busqueda.js?nocache=20260831v2"></script>
    <script src="js/data-temporada-actual.js?nocache=20260831v2"></script>
    <script src="js/data-historico.js?nocache=20260831v2"></script>
    <script src="js/data-utils.js?nocache=20260831v2"></script>
    <script src="js/data-videos.js?nocache=20260831v2"></script>
    <script src="js/app.js?nocache=20260831v2"></script>
    <script src="js/script.js?nocache=20260831v2"></script>
    <script src="js/main.js?nocache=20260831v2"></script>

    <!-- Script para asignar URL actual a botones de compartir página -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const pageUrl = encodeURIComponent(window.location.href);
        const shareText = encodeURIComponent(
          'Resúmenes y mejores momentos del Real Oviedo - Sangre Carbayona',
        );

        document.getElementById('share-whatsapp').href =
          `https://api.whatsapp.com/send?text=${shareText} ${pageUrl}`;
        document.getElementById('share-twitter').href =
          `https://twitter.com/intent/tweet?url=${pageUrl}&text=${shareText}`;
        document.getElementById('share-telegram').href =
          `https://t.me/share/url?url=${pageUrl}&text=${shareText}`;
        document.getElementById('share-facebook').href =
          `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;
      });
    </script>
  </body>
</html>
