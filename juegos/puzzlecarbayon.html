<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Carbayón | Sangre Carbayona</title>

    <!-- Rutas relativas subiendo un nivel con ../ -->
    <link rel="stylesheet" href="../css/styles.css?nocache=20260829v2" />
    <link
      rel="stylesheet"
      href="../css/equipo-styles.css?nocache=20260829v2"
    />
    <link rel="stylesheet" href="../css/puzzle.css?nocache=20260829v2" />

    <!-- Fuentes y FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta
      name="description"
      content="Recompón las imágenes del Real Oviedo en este puzzle interactivo. ¡Demuestra que eres Carbayón!"
    />
    <meta property="og:title" content="Puzzle Carbayón | Sangre Carbayona" />
    <meta
      property="og:description"
      content="Recompón las imágenes del Real Oviedo en este puzzle interactivo. ¡Demuestra que eres Carbayón!"
    />
    <meta
      property="og:image"
      content="https://taramunde.github.io/SangreCarbayona2/img/varios/PuzzleRealOviedo.webp"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Header Principal Dinámico -->
    <header class="main-header" id="header-placeholder"></header>

    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-games/1920/400"
          alt="Fondo"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <!-- Rutas corregidas con ../ -->
          <a href="../index.html">Inicio</a><span>/</span>
          <a href="../juegos.html">Juegos</a><span>/</span>
          <span class="current">Puzzle Carbayón</span>
        </div>
        <h1 class="page-title">Puzzle Carbayón</h1>
      </div>
    </section>

    <!-- ZONA DEL JUEGO -->
    <section class="puzzle-section">
      <div class="puzzle-container">
        <div class="puzzle-dashboard">
          <div>
            <h2 id="levelTitle" style="margin: 0; color: var(--primary-color)">
              Cargando...
            </h2>
            <p
              id="diffLabel"
              style="margin: 5px 0 0 0; font-size: 0.9em; color: #666"
            ></p>
          </div>
          <div class="puzzle-controls">
            <select id="levelSelect"></select>
            <select id="diffSelect">
              <option value="easy">Fácil</option>
              <option value="medium" selected>Medio</option>
              <option value="hard">Difícil</option>
              <option value="legend">Leyenda</option>
            </select>
            <button id="previewBtn">
              <i class="fas fa-eye"></i> Ver Imagen
            </button>
            <button id="restartBtn">
              <i class="fas fa-redo"></i> Reiniciar
            </button>
          </div>
          <div class="puzzle-stats">
            <span
              ><i class="fas fa-clock"></i> <span id="time">00:00</span></span
            >
            <span
              ><i class="fas fa-chart-line"></i>
              <span id="progress">0%</span></span
            >
            <span
              ><i class="fas fa-puzzle-piece"></i>
              <span id="placedCount">0/0</span></span
            >
          </div>
        </div>

        <div id="boardWrap">
          <div id="board"></div>
          <div id="previewOverlay">
            <img id="previewImg" alt="Vista previa del rompecabezas" />
          </div>
        </div>

        <div id="trayWrap">
          <button id="trayLeft" class="tray-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div id="tray"></div>
          <button id="trayRight" class="tray-btn">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
        <div
          id="trayCount"
          style="
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #555;
          "
        ></div>
      </div>
    </section>

    <!-- Modal de Victoria -->
    <div id="puzzleWinModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>¡Felicidades Carbayón!</h2>
        <p>Has completado el puzzle con éxito.</p>
        <img id="winThumb" alt="Rompecabezas completado" />
        <div
          id="winStats"
          style="font-size: 1.1rem; font-weight: 600; margin-bottom: 20px"
        ></div>
        <div style="display: flex; gap: 10px; justify-content: center">
          <button
            id="closeWinBtn"
            style="
              padding: 12px 24px;
              border-radius: 30px;
              border: 2px solid #ddd;
              background: white;
              font-weight: bold;
              cursor: pointer;
            "
          >
            Cerrar
          </button>
          <button
            id="nextBtn"
            style="
              padding: 12px 24px;
              border-radius: 30px;
              border: none;
              background: var(--primary-color, #001a6e);
              color: white;
              font-weight: bold;
              cursor: pointer;
            "
          >
            Siguiente Nivel →
          </button>
        </div>
      </div>
    </div>
    <canvas id="puzzleConfetti"></canvas>

    <!-- Compartir página -->
    <div class="container">
      <div class="page-share">
        <p data-i18n="compartir_pagina">Comparte esta página</p>
        <div class="page-share-buttons" id="pageShareButtons"></div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <!-- Scripts con ../ y nocache -->
    <script src="../js/i18n.js?nocache=20260829v2"></script>
    <script src="../js/seo.js?nocache=20260829v2"></script>
    <script src="../js/data-club.js?nocache=20260829v2"></script>
    <script src="../js/data-jugadores.js?nocache=20260829v2"></script>
    <script src="../js/busqueda.js?nocache=20260829v2"></script>
    <script src="../js/data-temporada-actual.js?nocache=20260829v2"></script>
    <script src="../js/data-historico.js?nocache=20260829v2"></script>
    <script src="../js/data-utils.js?nocache=20260829v2"></script>
    <script src="../js/app.js?nocache=20260829v2"></script>
    <script src="../js/script.js?nocache=20260829v2"></script>
    <script src="../js/compartir-pagina.js?nocache=20260829v2"></script>
    <script src="../js/main.js?nocache=20260829v2"></script>

    <!-- Importamos el juego saliendo a la raíz y entrando a js/puzzle -->
    <script type="module">
      import { init } from '../js/puzzle/game.js?nocache=20260829v2';
      init();
    </script>
  </body>
</html>
