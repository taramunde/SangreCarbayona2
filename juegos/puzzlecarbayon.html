<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Carbayón | Sangre Carbayona</title>

    <!-- Rutas relativas subiendo un nivel con ../ -->
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/equipo-styles.css" />

    <!-- Fuentes y FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* Motor del Puzzle - Estilos integrados */
      .puzzle-container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .puzzle-dashboard {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        margin-bottom: 20px;
      }
      .puzzle-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .puzzle-controls select,
      .puzzle-controls button {
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-family: inherit;
        font-weight: 600;
      }
      .puzzle-controls button {
        background: var(--primary-color, #001a6e);
        color: white;
        cursor: pointer;
        border: none;
        transition: 0.2s;
      }
      .puzzle-controls button:hover {
        opacity: 0.9;
      }
      .puzzle-stats {
        display: flex;
        gap: 20px;
        font-weight: 600;
        color: #555;
      }

      #boardWrap {
        background-color: #f0f4ff;
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        position: relative;
        width: 100%;
        overflow: hidden;
        min-height: 500px;
        margin: 0 auto;
        box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.05);
        touch-action: none; /* NUEVO: Bloquea el scroll de pantalla al tocar el tablero */
      }

      #board {
        position: relative;
        margin: 0 auto;
      }

      .piece {
        cursor: grab;
        filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
        transition: transform 0.1s;
        touch-action: none; /* NUEVO: Evita que la pantalla se mueva al arrastrar */
        user-select: none; /* NUEVO: Evita que se seleccione como texto sin querer */
        -webkit-user-select: none; /* Para Safari en iPhone */
      }
      .piece:active {
        cursor: grabbing;
        transform: scale(1.05);
        z-index: 99 !important;
      }
      .piece.placed {
        cursor: default;
        filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.1));
      }

      #trayWrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        background: #fff;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      #tray {
        display: flex;
        gap: 15px;
        padding: 10px;
        overflow-x: auto;
        flex: 1;
        min-height: 140px;
        align-items: center;
        scroll-behavior: smooth;
        touch-action: none;
      }
      #tray::-webkit-scrollbar {
        height: 8px;
      }
      #tray::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .tray-btn {
        background: var(--secondary-color, #ffcc00);
        color: #001a6e;
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2rem;
        flex-shrink: 0;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      #previewOverlay {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        backdrop-filter: blur(3px);
      }
      #previewOverlay.on {
        opacity: 1;
      }
      #previewImg {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      /* Modal de Victoria */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 26, 110, 0.9);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        backdrop-filter: blur(5px);
      }
      .modal-content {
        background: white;
        color: #333;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }
      .modal-content h2 {
        color: var(--primary-color, #001a6e);
        font-size: 2rem;
        margin-bottom: 20px;
      }
      .modal-content img {
        max-width: 100%;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 4px solid var(--secondary-color, #ffcc00);
      }
      .pill {
        display: inline-block;
        background: var(--primary-color, #001a6e);
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 10px;
      }
      .hidden {
        display: none !important;
      }
      #puzzleConfetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1001;
      }
    </style>
  </head>
  <body>
    <!-- Header Principal Dinámico -->
    <header class="main-header" id="header-placeholder"></header>

    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-games/1920/400"
          alt="Fondo"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <!-- Rutas corregidas con ../ -->
          <a href="../index.html">Inicio</a><span>/</span>
          <a href="../juegos.html">Juegos</a><span>/</span>
          <span class="current">Puzzle Carbayón</span>
        </div>
        <h1 class="page-title">Puzzle Carbayón</h1>
      </div>
    </section>

    <!-- ZONA DEL JUEGO -->
    <section class="puzzle-section">
      <div class="puzzle-container">
        <div class="puzzle-dashboard">
          <div>
            <h2 id="levelTitle" style="margin: 0; color: var(--primary-color)">
              Cargando...
            </h2>
            <p
              id="diffLabel"
              style="margin: 5px 0 0 0; font-size: 0.9em; color: #666"
            ></p>
          </div>
          <div class="puzzle-controls">
            <select id="levelSelect"></select>
            <select id="diffSelect">
              <option value="easy">Fácil</option>
              <option value="medium" selected>Medio</option>
              <option value="hard">Difícil</option>
              <option value="legend">Leyenda</option>
            </select>
            <button id="previewBtn">
              <i class="fas fa-eye"></i> Ver Imagen
            </button>
            <button id="restartBtn">
              <i class="fas fa-redo"></i> Reiniciar
            </button>
          </div>
          <div class="puzzle-stats">
            <span
              ><i class="fas fa-clock"></i> <span id="time">00:00</span></span
            >
            <span
              ><i class="fas fa-chart-line"></i>
              <span id="progress">0%</span></span
            >
            <span
              ><i class="fas fa-puzzle-piece"></i>
              <span id="placedCount">0/0</span></span
            >
          </div>
        </div>

        <div id="boardWrap">
          <div id="board"></div>
          <div id="previewOverlay" class="hidden">
            <img id="previewImg" />
          </div>
        </div>

        <div id="trayWrap">
          <button id="trayLeft" class="tray-btn">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div id="tray"></div>
          <button id="trayRight" class="tray-btn">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
        <div
          id="trayCount"
          style="
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: #555;
          "
        ></div>
      </div>
    </section>

    <!-- Modal de Victoria -->
    <div id="puzzleWinModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>¡Felicidades Carbayón!</h2>
        <p>Has completado el puzzle con éxito.</p>
        <img id="winThumb" />
        <div
          id="winStats"
          style="font-size: 1.1rem; font-weight: 600; margin-bottom: 20px"
        ></div>
        <div style="display: flex; gap: 10px; justify-content: center">
          <button
            id="closeWinBtn"
            style="
              padding: 12px 24px;
              border-radius: 30px;
              border: 2px solid #ddd;
              background: white;
              font-weight: bold;
              cursor: pointer;
            "
          >
            Cerrar
          </button>
          <button
            id="nextBtn"
            style="
              padding: 12px 24px;
              border-radius: 30px;
              border: none;
              background: var(--primary-color, #001a6e);
              color: white;
              font-weight: bold;
              cursor: pointer;
            "
          >
            Siguiente Nivel →
          </button>
        </div>
      </div>
    </div>
    <canvas id="puzzleConfetti"></canvas>

    <!-- Footer -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <!-- Scripts con ../ y nocache -->
    <script src="../js/i18n.js?nocache=20251231v33"></script>
    <script src="../js/data-club.js?nocache=20260426v60"></script>
    <script src="../js/data-jugadores.js?nocache=20260426v149"></script>
    <script src="../js/busqueda.js?nocache=20260614v4"></script>
    <script src="../js/data-temporada-actual.js?nocache=20260426v30"></script>
    <script src="../js/data-historico.js?nocache=20260426v193"></script>
    <script src="../js/data-utils.js?nocache=20260426v4"></script>
    <script src="../js/app.js?nocache=20251231v174"></script>
    <script src="../js/script.js?nocache=20251231v6"></script>
    <script src="../js/main.js?nocache=20260426v2"></script>

    <!-- Importamos el juego saliendo a la raíz y entrando a js/puzzle -->
    <script type="module">
      import { init } from '../js/puzzle/game.js?nocache=20260426v3';
      init();
    </script>
  </body>
</html>
