<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="calendario_titulo">Calendario | Sangre Carbayona</title>
    <link rel="stylesheet" href="css/styles.css?nocache=20260601v1" />
    <link rel="stylesheet" href="css/calendario.css?nocache=20260601v1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta property="og:title" content="Calendario LaLiga - Sangre Carbayona" />
    <meta
      property="og:description"
      content="Calendario completo del Real Oviedo en LaLiga Hypermotion 2026/27."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- ===== HEADER  ===== -->
    <header class="main-header" id="header-placeholder"></header>
    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <!-- ===== HERO ===== -->
    <section class="cal-hero">
      <div class="cal-hero-bg"></div>
      <div class="container">
        <div class="cal-hero-content">
          <span class="cal-badge" data-i18n="laliga_hypermotion"
            ><i class="fas fa-calendar-alt"></i> LaLiga Hypermotion</span
          >
          <h1 data-i18n="calendario_titulo">Calendario <span>2026/27</span></h1>
          <p data-i18n="calendario_subtitulo">
            Todos los partidos del Real Oviedo · Segunda División
          </p>
        </div>
      </div>
    </section>

    <!-- ===== MAIN ===== -->
    <main class="cal-main">
      <div class="container">
        <!-- RESUMEN STATS -->
        <div class="cal-stats-bar" id="statsBar">
          <div class="cal-stat-item">
            <span class="cal-stat-num" id="statJugados">—</span>
            <span class="cal-stat-label" data-i18n="calendario_jugados"
              >Jugados</span
            >
          </div>
          <div class="cal-stat-divider"></div>
          <div class="cal-stat-item cal-stat-win">
            <span class="cal-stat-num" id="statGanados">—</span>
            <span class="cal-stat-label" data-i18n="calendario_victorias"
              >Victorias</span
            >
          </div>
          <div class="cal-stat-divider"></div>
          <div class="cal-stat-item cal-stat-draw">
            <span class="cal-stat-num" id="statEmpates">—</span>
            <span class="cal-stat-label" data-i18n="calendario_empates"
              >Empates</span
            >
          </div>
          <div class="cal-stat-divider"></div>
          <div class="cal-stat-item cal-stat-loss">
            <span class="cal-stat-num" id="statDerrotas">—</span>
            <span class="cal-stat-label" data-i18n="calendario_derrotas"
              >Derrotas</span
            >
          </div>
          <div class="cal-stat-divider"></div>
          <div class="cal-stat-item">
            <span class="cal-stat-num" id="statGoles">—</span>
            <span class="cal-stat-label" data-i18n="calendario_goles"
              >Goles</span
            >
          </div>
          <div class="cal-stat-divider"></div>
          <div class="cal-stat-item">
            <span class="cal-stat-num" id="statPendientes">—</span>
            <span class="cal-stat-label" data-i18n="calendario_pendientes"
              >Pendientes</span
            >
          </div>
        </div>

        <!-- FILTROS -->
        <div class="cal-filters">
          <button
            class="cal-filter-btn active"
            data-filter="todos"
            data-i18n="calendario_todos"
          >
            <i class="fas fa-list"></i> Todos
          </button>
          <button
            class="cal-filter-btn"
            data-filter="jugados"
            data-i18n="calendario_jugados_filtro"
          >
            <i class="fas fa-check-circle"></i> Jugados
          </button>
          <button
            class="cal-filter-btn"
            data-filter="pendientes"
            data-i18n="calendario_pendientes_filtro"
          >
            <i class="fas fa-clock"></i> Pendientes
          </button>
          <button
            class="cal-filter-btn"
            data-filter="local"
            data-i18n="calendario_en_casa"
          >
            <i class="fas fa-home"></i> En casa
          </button>
          <button
            class="cal-filter-btn"
            data-filter="visitante"
            data-i18n="calendario_fuera"
          >
            <i class="fas fa-plane"></i> Fuera
          </button>
        </div>

        <!-- LISTA DE JORNADAS -->
        <div id="jornadasContainer">
          <!-- Generado dinámicamente por calendario.js -->
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20260601v4"></script>
    <script src="js/script.js?nocache=20260601v1"></script>
    <script src="js/clasificacion.js?nocache=20260601v7"></script>
    <script src="js/calendario.js?nocache=20260601v4"></script>
    <script src="js/main.js?nocache=20260601v1"></script>
    <script src="js/data-club.js?nocache=20260426v7"></script>
    <script src="js/data-jugadores.js?nocache=20260426v107"></script>
    <script src="js/busqueda.js?nocache=20260614v4"></script>
  </body>
</html>
