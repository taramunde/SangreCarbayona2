<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

  <body>
    <header class="main-header" id="header-placeholder"></header>
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <section class="page-header">
      <div
        class="page-header-bg"
        style="
          background: linear-gradient(
            135deg,
            #003da5 0%,
            #002070 60%,
            #1a1a2e 100%
          );
        "
      ></div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <a href="derbis.html" data-i18n="nav_derbis">Derbis Asturianos</a

      </div>
    </section>

        <div class="match-hero">
          <div class="match-team team-local">
            <img id="escudo-local" src="" alt="" />

          </div>
          <div class="match-center">
            <div class="meta" id="fecha-partido"></div>
            <div class="score" id="resultado-partido"></div>
            <div class="stadium" id="estadio-partido"></div>
          </div>
          <div class="match-team team-visitante">
            <img id="escudo-visitante" src="" alt="" />
            <h2 id="nombre-visitante"></h2>
          </div>
        </div>

        <div class="lineups-section">
          <div class="lineups-grid">
            <div class="lineup-column" id="alineacion-local"></div>
            <div class="lineup-column" id="alineacion-visitante"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/data-club.js?nocache=20260426v9"></script>
