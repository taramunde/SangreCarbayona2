<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derbis Asturianos | Sangre Carbayona</title>
    <meta
      name="description"
      content="Todos los derbis asturianos entre el Real Oviedo y el Sporting de Gijón: resultados, historia y estadísticas."
    />
    <link rel="stylesheet" href="css/styles.css?nocache=20260825v1" />
    <link rel="stylesheet" href="css/derbis.css?nocache=20260825v1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

  <body>
    <header class="main-header" id="header-placeholder"></header>
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
            aria-label="Buscar en la web"
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-derbis/1920/400"
          alt="Estadio"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <span class="current" data-i18n="nav_derbis">Derbis Asturianos</span>
        </div>
        <h1 class="page-title" data-i18n="nav_derbis">Derbis Asturianos</h1>
        <p class="page-subtitle">
          Historial completo · Real Oviedo vs Sporting de Gijón
        </p>
      </div>
    </section>

    <section class="derbis-listing-section">
      <div class="container">
        <!-- Cabecera de sección -->
        <div class="section-header">
          <h2 class="section-title">Historial de partidos</h2>
        </div>

        <!-- Resumen estadístico -->
        <div class="derbis-stats-bar" id="derbisStatsBar"></div>

        <!-- Tabla -->
        <div class="derbis-table-scroll">
          <table class="derbis-historial-table">
            <thead>
              <tr>
                <th>Temporada</th>
                <th>Competición</th>
                <th>J.</th>
                <th>Fecha</th>
                <th>Local</th>
                <th>Resultado</th>
                <th>Visitante</th>
                <th class="hide-mobile">Estadio</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="derbisTbody"></tbody>
          </table>
        </div>

        <!-- Leyenda -->
        <div class="derbis-leyenda">
          <div class="leyenda-item">
            <span class="dot dot-oviedo"></span><span>Victoria Oviedo</span>
          </div>
          <div class="leyenda-item">
            <span class="dot dot-empate"></span><span>Empate</span>
          </div>
          <div class="leyenda-item">
            <span class="dot dot-rival"></span><span>Victoria rival</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Compartir página -->
    <div class="container">
      <div class="page-share">
        <p data-i18n="compartir_pagina">Comparte esta página</p>
        <div class="page-share-buttons" id="pageShareButtons"></div>
      </div>
    </div>

    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/data-club.js?nocache=20260825v1"></script>

    <script src="js/main.js?nocache=20260825v1"></script>
    <script src="js/data-derbis.js?nocache=20260825v1"></script>
    <script src="js/derbis.js?nocache=20260825v1"></script>
    <script src="js/compartir-pagina.js?nocache=20260825v1"></script>
