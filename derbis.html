<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derbis Asturianos | Sangre Carbayona</title>
    <link rel="stylesheet" href="css/styles.css?nocache=20260426v5" />
    <link rel="stylesheet" href="css/derbis.css?nocache=20260426v6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header" id="header-placeholder"></header>

    <section class="page-header">
      <div
        class="page-header-bg"
        style="
          background: linear-gradient(
            135deg,
            #003da5 0%,
            #002070 60%,
            #1a1a2e 100%
          );
        "
      ></div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <span class="current" data-i18n="nav_derbis">Derbis Asturianos</span>
        </div>
        <h1 class="page-title" data-i18n="nav_derbis">Derbis Asturianos</h1>
        <p class="page-subtitle">
          Historial completo · Real Oviedo vs Sporting de Gijón
        </p>
      </div>
    </section>

    <section class="derbis-listing-section">
      <div class="container">
        <!-- Cabecera de sección -->
        <div class="section-header">
          <h2 class="section-title">Historial de partidos</h2>
        </div>

        <!-- Resumen estadístico -->
        <div class="derbis-stats-bar" id="derbisStatsBar"></div>

        <!-- Tabla -->
        <div class="derbis-table-scroll">
          <table class="derbis-historial-table">
            <thead>
              <tr>
                <th>Temporada</th>
                <th>Competición</th>
                <th>J.</th>
                <th>Fecha</th>
                <th>Local</th>
                <th>Resultado</th>
                <th>Visitante</th>
                <th class="hide-mobile">Estadio</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="derbisTbody"></tbody>
          </table>
        </div>

        <!-- Leyenda -->
        <div class="derbis-leyenda">
          <div class="leyenda-item">
            <span class="dot dot-oviedo"></span><span>Victoria Oviedo</span>
          </div>
          <div class="leyenda-item">
            <span class="dot dot-empate"></span><span>Empate</span>
          </div>
          <div class="leyenda-item">
            <span class="dot dot-rival"></span><span>Victoria rival</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20260426v5"></script>
    <script src="js/main.js?nocache=20260426v5"></script>
    <script src="js/data-derbis.js?nocache=20260426v5"></script>
    <script src="js/derbis.js?nocache=20260426v6"></script>
  </body>
</html>
