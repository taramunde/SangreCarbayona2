<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="primera_div_titulo">
      Primera División | Sangre Carbayona
    </title>
    <link rel="stylesheet" href="css/styles.css?nocache=20251231v4" />
    <link rel="stylesheet" href="css/equipo-styles.css?nocache=20251231v7" />
    <link rel="stylesheet" href="css/primera-division.css?nocache=20251231v1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta property="og:title" content="Primera División - Sangre Carbayona" />
    <meta
      property="og:description"
      content="Histórico de partidos de Primera División del Real Oviedo"
    />
    <meta
      property="og:image"
      content="https://i.postimg.cc/8PjPkJHc/Real-Oviedo-Joya.png"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- Header Principal -->
    <header class="main-header" id="header-placeholder"></header>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Page Header -->
    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-laliga/1920/400"
          alt="Primera División"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <a href="#" data-i18n="nav_competiciones">Competiciones</a
          ><span>/</span>
          <span class="current" data-i18n="primera_div_titulo"
            >Primera División</span
          >
        </div>
        <h1 class="page-title" data-i18n="primera_div_titulo">
          Primera División
        </h1>
        <p class="page-subtitle" data-i18n="primera_div_subtitulo">
          Histórico de partidos temporada por temporada
        </p>
      </div>
    </section>

    <!-- Contenido Principal -->
    <section class="primera-division-section">
      <div class="container">
        <!-- Selector de Temporadas -->
        <div class="temporada-tabs" id="temporadaSelector">
          <!-- Se genera dinámicamente desde JS -->
        </div>

        <!-- Panel de Filtros -->
        <div class="filtros-panel">
          <div class="filtro-grupo">
            <label class="filtro-label">
              <input type="checkbox" id="soloOviedo" checked />
              <span data-i18n="solo_oviedo">Solo partidos del Real Oviedo</span>
            </label>
          </div>

          <div class="filtro-grupo">
            <label class="filtro-label" data-i18n="filtro_rival">Rival:</label>
            <select id="filtroRival" class="filtro-select">
              <option value="todos" data-i18n="todos_equipos">
                Todos los equipos
              </option>
              <!-- Se rellena dinámicamente -->
            </select>
          </div>

          <div class="filtro-grupo">
            <label class="filtro-label" data-i18n="filtro_resultado"
              >Resultado:</label
            >
            <select id="filtroResultado" class="filtro-select">
              <option value="todos" data-i18n="filtro_todos">Todos</option>
              <option value="victoria" data-i18n="victorias_oviedo">
                Victorias Oviedo
              </option>
              <option value="empate" data-i18n="empates_resultado">
                Empates
              </option>
              <option value="derrota" data-i18n="derrotas_oviedo">
                Derrotas Oviedo
              </option>
            </select>
          </div>

          <div class="filtro-grupo">
            <button
              class="btn-toggle-all"
              id="colapsarTodas"
              data-i18n="colapsar_todas"
            >
              <i class="fas fa-compress-alt"></i> Colapsar todas
            </button>
            <button
              class="btn-toggle-all"
              id="expandirTodas"
              style="display: none"
              data-i18n="expandir_todas"
            >
              <i class="fas fa-expand-alt"></i> Expandir todas
            </button>
          </div>
        </div>

        <!-- Resumen de filtros activos -->
        <div class="resumen-filtros" id="resumenFiltros" style="display: none">
          <span
            ><span data-i18n="mostrando_partidos">Mostrando:</span>
            <strong id="contadorPartidos">0</strong>
            <span data-i18n="partidos_contador">partidos</span></span
          >
          <button
            class="btn-limpiar"
            id="limpiarFiltros"
            data-i18n="limpiar_filtros"
          >
            Limpiar filtros
          </button>
        </div>

        <!-- Contenedor de Jornadas -->
        <div id="jornadasContainer">
          <!-- Se genera dinámicamente -->
        </div>

        <!-- Mensaje cuando no hay resultados -->
        <div class="no-resultados" id="noResultados" style="display: none">
          <i class="fas fa-search"></i>
          <p data-i18n="no_resultados_filtros">
            No se encontraron partidos con los filtros seleccionados
          </p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20251231v30"></script>
    <script src="js/data-club.js?nocache=20260426v21"></script>
    <script src="js/data-jugadores.js?nocache=20260426v59"></script>
    <script src="js/busqueda.js?nocache=20260614v4"></script>
    <script src="js/data-temporada-actual.js?nocache=20260426v110"></script>
    <script src="js/data-historico.js?nocache=20260426v196"></script>
    <script src="js/data-utils.js?nocache=20260426v4"></script>
    <script src="js/primera-division.js?nocache=20251231v555"></script>
    <script src="js/script.js?nocache=20251231v3"></script>
    <script src="js/main.js?nocache=20251231v12"></script>
  </body>
</html>
