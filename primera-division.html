<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primera División | Sangre Carbayona</title>
    <link rel="stylesheet" href="css/styles.css?nocache=20251231v4" />
    <link rel="stylesheet" href="css/equipo-styles.css?nocache=20251231v4" />
    <link rel="stylesheet" href="css/primera-division.css?nocache=20251231v1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta property="og:title" content="Primera División - Sangre Carbayona" />
    <meta
      property="og:description"
      content="Histórico de partidos de Primera División del Real Oviedo"
    />
    <meta
      property="og:image"
      content="https://i.postimg.cc/8PjPkJHc/Real-Oviedo-Joya.png"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- Header Principal -->
    <header class="main-header" id="header-placeholder"></header>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Page Header -->
    <section class="page-header">
      <div class="page-header-bg">
        <img
          src="https://picsum.photos/seed/stadium-laliga/1920/400"
          alt="Primera División"
        />
      </div>
      <div class="container">
        <div class="breadcrumb">
          <a href="index.html" data-i18n="nav_inicio">Inicio</a><span>/</span>
          <a href="#" data-i18n="nav_competiciones">Competiciones</a
          ><span>/</span>
          <span class="current">Primera División</span>
        </div>
        <h1 class="page-title">Primera División</h1>
        <p class="page-subtitle">
          Histórico de partidos temporada por temporada
        </p>
      </div>
    </section>

    <!-- Contenido Principal -->
    <section class="primera-division-section">
      <div class="container">
        <!-- Selector de Temporadas -->
        <div class="temporada-tabs" id="temporadaSelector">
          <!-- Se genera dinámicamente desde JS -->
        </div>

        <!-- Panel de Filtros -->
        <div class="filtros-panel">
          <div class="filtro-grupo">
            <label class="filtro-label">
              <input type="checkbox" id="soloOviedo" checked />
              <span>Solo partidos del Real Oviedo</span>
            </label>
          </div>

          <div class="filtro-grupo">
            <label class="filtro-label">Rival:</label>
            <select id="filtroRival" class="filtro-select">
              <option value="todos">Todos los equipos</option>
              <!-- Se rellena dinámicamente -->
            </select>
          </div>

          <div class="filtro-grupo">
            <label class="filtro-label">Resultado:</label>
            <select id="filtroResultado" class="filtro-select">
              <option value="todos">Todos</option>
              <option value="victoria">Victorias Oviedo</option>
              <option value="empate">Empates</option>
              <option value="derrota">Derrotas Oviedo</option>
            </select>
          </div>

          <div class="filtro-grupo">
            <button class="btn-toggle-all" id="colapsarTodas">
              <i class="fas fa-compress-alt"></i> Colapsar todas
            </button>
            <button
              class="btn-toggle-all"
              id="expandirTodas"
              style="display: none"
            >
              <i class="fas fa-expand-alt"></i> Expandir todas
            </button>
          </div>
        </div>

        <!-- Resumen de filtros activos -->
        <div class="resumen-filtros" id="resumenFiltros" style="display: none">
          <span
            >Mostrando: <strong id="contadorPartidos">0</strong> partidos</span
          >
          <button class="btn-limpiar" id="limpiarFiltros">
            Limpiar filtros
          </button>
        </div>

        <!-- Contenedor de Jornadas -->
        <div id="jornadasContainer">
          <!-- Se genera dinámicamente -->
        </div>

        <!-- Mensaje cuando no hay resultados -->
        <div class="no-resultados" id="noResultados" style="display: none">
          <i class="fas fa-search"></i>
          <p>No se encontraron partidos con los filtros seleccionados</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20251231v22"></script>
    <script src="js/data.js?nocache=20251231v55"></script>
    <script src="js/primera-division.js?nocache=20251231v1"></script>
    <script src="js/script.js?nocache=20251231v3"></script>
    <script src="js/main.js?nocache=20251231v3"></script>
  </body>
</html>
