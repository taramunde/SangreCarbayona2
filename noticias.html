<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="noticias_titulo">Noticias | Sangre Carbayona</title>
    <link rel="stylesheet" href="css/styles.css?nocache=20260905v1" />
    <link rel="stylesheet" href="css/noticias.css?nocache=20260905v1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta
      name="description"
      content="Últimas noticias del Real Oviedo en los principales medios asturianos y nacionales."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Noticias - Sangre Carbayona" />
    <meta
      property="og:description"
      content="Últimas noticias del Real Oviedo en los principales medios asturianos y nacionales."
    />
    <meta
      property="og:image"
      content="https://i.postimg.cc/tgL8SLYy/Sangre-Carbayona-C-D-Oviedo-Stadium-Ovetense.webp"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Header Principal (idéntico al index) -->
    <header class="main-header" id="header-placeholder"></header>

    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            placeholder="Buscar en la web..."
            aria-label="Buscar en la web"
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Page Hero -->
    <div class="page-hero">
      <div class="page-hero-bg"></div>
      <div class="container">
        <div class="page-hero-content">
          <span class="page-hero-label" data-i18n="noticias_medios"
            ><i class="fas fa-newspaper"></i> Medios</span
          >
          <h1 class="page-hero-title" data-i18n="noticias_titulo">
            Últimas Noticias
          </h1>
          <p class="page-hero-sub" data-i18n="noticias_subtitulo">
            Toda la actualidad del Real Oviedo en los principales medios
          </p>
        </div>
      </div>
    </div>

    <!-- Filtro de medios -->
    <section class="news-filter-section">
      <div class="container">
        <div class="news-filter-bar">
          <button
            class="filter-btn active"
            data-medio="all"
            data-i18n="noticias_todos"
          >
            Todos
          </button>
          <button
            class="filter-btn"
            data-medio="lavozdeasturias"
            data-i18n="noticias_lavoz"
          >
            La Voz de Asturias
          </button>
          <button
            class="filter-btn"
            data-medio="elcomercio"
            data-i18n="noticias_elcomercio"
          >
            El Comercio
          </button>
          <button
            class="filter-btn"
            data-medio="killerasturias"
            data-i18n="noticias_killer"
          >
            Killer Asturias
          </button>
        </div>
      </div>
    </section>

    <!-- Grid de noticias -->
    <section class="news-page-section">
      <div class="container">
        <!-- Estado de carga -->
        <div class="news-loading" id="noticiasLoading">
          <div class="loading-spinner"></div>
          <p data-i18n="noticias_cargando">Cargando noticias...</p>
        </div>

        <!-- Grid principal -->
        <div class="news-page-grid" id="noticiasPageGrid" style="display: none">
          <!-- Las tarjetas se inyectan desde noticias.js -->
        </div>

        <!-- Estado vacío / error -->
        <div class="news-empty" id="noticiasEmpty" style="display: none">
          <i class="fas fa-newspaper"></i>
          <p data-i18n="noticias_error">
            No se pudieron cargar las noticias en este momento.
          </p>
          <button class="btn-retry" id="btnRetry" data-i18n="intentar_de_nuevo">
            Intentar de nuevo
          </button>
        </div>
      </div>
    </section>

    <!-- Compartir página -->
    <div class="container">
      <div class="page-share">
        <p data-i18n="compartir_pagina">Comparte esta página</p>
        <div class="page-share-buttons" id="pageShareButtons"></div>
      </div>
    </div>

    <!-- Footer (idéntico al index) -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <!-- Cookie Banner -->
    <div class="cookie-banner" id="cookieBanner">
      <div class="cookie-content">
        <p>
          Utilizamos cookies para mejorar tu experiencia.
          <a href="#">Más información</a>
        </p>
        <div class="cookie-buttons">
          <button class="btn-cookie reject" id="rejectCookies">Rechazar</button>
          <button class="btn-cookie accept" id="acceptCookies">Aceptar</button>
        </div>
      </div>
    </div>

    <script src="js/i18n.js?nocache=20260905v1"></script>
    <script src="js/seo.js?nocache=20260905v1"></script>
    <script src="js/script.js?nocache=20260905v1"></script>
    <script src="js/noticias.js?nocache=20260905v1"></script>
    <script src="js/main.js?nocache=20260905v1"></script>
    <script src="js/data-club.js?nocache=20260905v1"></script>
    <script src="js/data-jugadores.js?nocache=20260905v1"></script>
    <script src="js/busqueda.js?nocache=20260905v1"></script>
    <script src="js/compartir-pagina.js?nocache=20260905v1"></script>
  </body>
</html>
