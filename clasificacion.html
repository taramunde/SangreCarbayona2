<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificación LaLiga | Sangre Carbayona</title>
    <link rel="stylesheet" href="css/styles.css?nocache=20251231v26" />
    <link rel="stylesheet" href="css/clasificacion.css?nocache=20251231v34" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta
      property="og:title"
      content="Clasificación LaLiga - Sangre Carbayona"
    />
    <meta
      property="og:description"
      content="Clasificación actualizada de LaLiga. Sigue la temporada del Real Oviedo."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header" id="header-placeholder"></header>

    <!-- ===== HERO ===== -->
    <section class="clasi-hero">
      <div class="clasi-hero-bg"></div>
      <div class="container">
        <div class="clasi-hero-content">
          <span class="clasi-badge"
            ><i class="fas fa-trophy"></i> LaLiga EA Sports</span
          >
          <h1>Clasificación <span>2025/26</span></h1>
          <p>Seguimiento jornada a jornada · Real Oviedo en Primera División</p>
        </div>
      </div>
    </section>

    <!-- ===== MAIN ===== -->
    <main class="clasi-main">
      <div class="container">
        <!-- TABLA -->
        <div class="clasi-card">
          <div class="clasi-card-header">
            <h2><i class="fas fa-list-ol"></i> Tabla de Clasificación</h2>
            <span class="clasi-jornada-badge" id="jornadaBadge"
              >Cargando...</span
            >
          </div>
          <div class="table-responsive">
            <table id="tablaClasificacion">
              <thead>
                <tr>
                  <th title="Posición">Pos</th>
                  <th>Club</th>
                  <th title="Puntos">PTS</th>
                  <th title="Partidos Jugados">PJ</th>
                  <th title="Ganados">PG</th>
                  <th title="Empatados">PE</th>
                  <th title="Perdidos">PP</th>
                  <th title="Goles a Favor">GF</th>
                  <th title="Goles en Contra">GC</th>
                  <th title="Diferencia de Goles">DG</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>

          <!-- LEYENDA -->
          <div class="leyenda-container">
            <div class="leyenda-item">
              <span class="dot champions"></span> Champions League
            </div>
            <div class="leyenda-item">
              <span class="dot europa"></span> Europa League
            </div>
            <div class="leyenda-item">
              <span class="dot conference"></span> Conference League
            </div>
            <div class="leyenda-item">
              <span class="dot descenso"></span> Descenso
            </div>
          </div>
        </div>

        <!-- GRÁFICA EVOLUCIÓN -->
        <div class="clasi-card clasi-chart-card">
          <div class="clasi-card-header">
            <h2><i class="fas fa-chart-line"></i> Evolución Real Oviedo</h2>
            <div class="clasi-mini-stats">
              <div class="clasi-mini-stat">
                <span class="label">Mejor</span>
                <span class="value" id="team-position-best">—</span>
              </div>
              <div class="clasi-mini-stat">
                <span class="label">Peor</span>
                <span class="value" id="team-position-worst">—</span>
              </div>
              <div class="clasi-mini-stat">
                <span class="label">Actual</span>
                <span class="value" id="team-position-current">—</span>
              </div>
            </div>
          </div>
          <div class="chart-container">
            <canvas id="team-position-chart-canvas"></canvas>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20251231v24"></script>
    <script src="js/script.js?nocache=20251231v26"></script>
    <script src="js/clasificacion.js?nocache=20251231v30"></script>
    <script src="js/main.js?nocache=20251231v30"></script>
  </body>
</html>
