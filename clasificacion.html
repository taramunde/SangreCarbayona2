<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="clasificacion_titulo">
      Clasificación LaLiga | Sangre Carbayona
    </title>
    <link rel="stylesheet" href="css/styles.css?nocache=20260601v1" />
    <link rel="stylesheet" href="css/clasificacion.css?nocache=20260601v2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <meta
      property="og:title"
      content="Clasificación LaLiga - Sangre Carbayona"
    />
    <meta
      property="og:description"
      content="Clasificación actualizada de LaLiga Hypermotion. Sigue la temporada del Real Oviedo."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header" id="header-placeholder"></header>
    <!-- Search Overlay -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <form class="search-form">
          <input
            type="text"
            data-i18n="buscar"
            placeholder="Buscar en la web..."
          />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <button class="close-search" id="closeSearch">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    <!-- ===== HERO ===== -->
    <section class="clasi-hero">
      <div class="clasi-hero-bg"></div>
      <div class="container">
        <div class="clasi-hero-content">
          <span class="clasi-badge" data-i18n="laliga_hypermotion"
            ><i class="fas fa-trophy"></i> LaLiga Hypermotion</span
          >
          <h1 data-i18n="clasificacion_titulo">
            Clasificación <span>2026/27</span>
          </h1>
          <p data-i18n="clasificacion_subtitulo">
            Seguimiento jornada a jornada · Real Oviedo en Segunda División
          </p>
        </div>
      </div>
    </section>

    <!-- ===== MAIN ===== -->
    <main class="clasi-main">
      <div class="container">
        <!-- TABLA -->
        <div class="clasi-card">
          <div class="clasi-card-header">
            <h2 data-i18n="tabla_clasificacion">
              <i class="fas fa-list-ol"></i> Tabla de Clasificación
            </h2>
            <span
              class="clasi-jornada-badge"
              id="jornadaBadge"
              data-i18n="cargando"
              >Cargando...</span
            >
          </div>
          <div class="table-responsive">
            <table id="tablaClasificacion">
              <thead>
                <tr>
                  <th title="Posición" data-i18n="col_pos">Pos</th>
                  <th data-i18n="col_club">Club</th>
                  <th title="Puntos" data-i18n="col_pts">PTS</th>
                  <th title="Partidos Jugados" data-i18n="col_pj">PJ</th>
                  <th title="Ganados" data-i18n="col_pg">PG</th>
                  <th title="Empatados" data-i18n="col_pe">PE</th>
                  <th title="Perdidos" data-i18n="col_pp">PP</th>
                  <th title="Goles a Favor" data-i18n="col_gf">GF</th>
                  <th title="Goles en Contra" data-i18n="col_gc">GC</th>
                  <th title="Diferencia de Goles" data-i18n="col_dg">DG</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>

          <!-- LEYENDA (Actualizada a Segunda División) -->
          <div class="leyenda-container">
            <div class="leyenda-item">
              <span class="dot ascenso-directo"></span>
              <span data-i18n="ascenso_directo">Ascenso Directo</span>
            </div>
            <div class="leyenda-item">
              <span class="dot playoff"></span>
              <span data-i18n="playoff_ascenso">Playoff de Ascenso</span>
            </div>
            <div class="leyenda-item">
              <span class="dot descenso"></span>
              <span data-i18n="descenso_liga">Descenso</span>
            </div>
          </div>
        </div>

        <!-- GRÁFICA EVOLUCIÓN -->
        <div class="clasi-card clasi-chart-card">
          <div class="clasi-card-header">
            <h2 data-i18n="evolucion_oviedo">
              <i class="fas fa-chart-line"></i> Evolución Real Oviedo
            </h2>
            <div class="clasi-mini-stats">
              <div class="clasi-mini-stat">
                <span class="label" data-i18n="mejor_posicion">Mejor</span>
                <span class="value" id="team-position-best">—</span>
              </div>
              <div class="clasi-mini-stat">
                <span class="label" data-i18n="peor_posicion">Peor</span>
                <span class="value" id="team-position-worst">—</span>
              </div>
              <div class="clasi-mini-stat">
                <span class="label" data-i18n="actual_posicion">Actual</span>
                <span class="value" id="team-position-current">—</span>
              </div>
            </div>
          </div>

          <div class="chart-scroll-wrapper">
            <div class="chart-container">
              <canvas id="team-position-chart-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer" id="footer-placeholder"></footer>

    <script src="js/i18n.js?nocache=20260601v2"></script>
    <script src="js/script.js?nocache=20260601v1"></script>
    <script src="js/clasificacion.js?nocache=20260601v6"></script>
    <script src="js/main.js?nocache=20260601v1"></script>
    <script src="js/data-club.js?nocache=20260426v3"></script>
    <script src="js/data-jugadores.js?nocache=20260426v101"></script>
    <script src="js/busqueda.js?nocache=20260614v4"></script>
  </body>
</html>
